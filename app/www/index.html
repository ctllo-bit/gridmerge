<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">
    <title>2048</title>
    <link href="./css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <main class="game-container">
    
    <div class="header">
      <div class="logo">2048</div>
      <div class="scores">
        <div class="score-box">
          <span class="score-title">分数</span>
          <span class="score-value">532</span>
        </div>
        <div class="score-box">
          <span class="score-title">最高分</span>
          <span class="score-value">69.6k</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <p class="desc">将数字合并起来，得到 2048 的方块！</p>
      <div class="buttons">
        <button class="btn btn-new">新的</button>
        <button class="btn btn-undo">撤回</button>
      </div>
    </div>

    <div class="grid-container">
      <div class="cell tile-4">4</div>
      <div class="cell tile-2">2</div>
      <div class="cell empty"></div>
      <div class="cell empty"></div>
      
      <div class="cell tile-8">8</div>
      <div class="cell tile-4">4</div>
      <div class="cell empty"></div>
      <div class="cell empty"></div>
      
      <div class="cell tile-32">32</div>
      <div class="cell tile-8">8</div>
      <div class="cell tile-4">4</div>
      <div class="cell tile-2">2</div>
      
      <div class="cell tile-64">64</div>
      <div class="cell tile-16">16</div>
      <div class="cell tile-8">8</div>
      <div class="cell tile-4">4</div>
    </div>
    
  </main>

    <script src="./js/index.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
