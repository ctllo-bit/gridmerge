<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">
    <title>2048</title>
    <link href="./css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <main class="container">
        <header class="heading">
            <h1 class="title">2048</h1>

            <div class="scores-container">
            <div class="score-container" data-label="分数">0
                <span class="score-addition">+4</span>
            </div>
            <div class="best-container" data-label="最高分">0
                <span class="score-addition">+4</span>
            </div>
            </div>
            
        </header>

        <section class="above-game">
            <p class="game-intro"><strong>合并数字方块，直到得到 2048。</strong></p>
            <button class="restart-button" type="button">新的游戏</button>
        </section>

        <section class="game-container">
            <div class="grid-container">
                <div class="grid x2">2</div>
                <div class="grid x4">2</div>
                <div class="grid x8">4</div>
                <div class="grid x16">2</div>

                <div class="grid x512">512</div>
                <div class="grid x8">16</div>
                <div class="grid x32">64</div>
                <div class="grid x8">8</div>

                <div class="grid x128">2</div>
                <div class="grid x2">4</div>
                <div class="grid x8">16</div>
                <div class="grid x64">32</div>

                <div class="grid x2">2</div>
                <div class="grid x8">4</div>
                <div class="grid x64">8</div>
                <div class="grid x128">16</div>
            </div>
        </section>
    </main>

    <script src="./js/index.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
