<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048</title>
    <link href="./css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <main class="game-container">
    
    <div class="header">
      <div class="logo">2048</div>
      <div class="scores">
        <div class="score-box">
          <span class="score-title">分数</span>
          <span class="score-value">0</span>
        </div>
        <div class="score-box">
          <span class="score-title">最高分</span>
          <span class="score-value">0</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <p class="desc">将数字合并起来，得到 2048 的方块！</p>
      <div class="buttons">
        <button class="btn btn-new restart-button">新的</button>
        <button class="btn btn-undo">撤回</button>
      </div>
    </div>

    <div class="grid-container">
        <div class="game-over" id="gameOverOverlay">
            <h2>游戏结束!</h2>
            <button class="btn retry-button" >再来一局</button>
        </div>
    </div>
    
  </main>

    <script src="./js/index.js"></script>
    <script src="./js/keyboard.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
